name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Mutation check (every mutant must be killed)
        run: python mutants.py

      - name: Smoke-test the CLI on the sample artifact
        run: |
          rc=0
          python assure.py samples/artifact.md --source samples/source.md \
            --out /tmp/sample-report.md || rc=$?
          test "$rc" -eq 1
          test -f /tmp/sample-report.md
          grep -q "AI-Output Assurance Report" /tmp/sample-report.md
          grep -q "NOT a certification" /tmp/sample-report.md
